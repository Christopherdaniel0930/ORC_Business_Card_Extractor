[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-card-extractor"
version = "0.2.0"
description = "Business card extraction using RapidOCR and an Ollama compatible LLM"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "rapidocr",
    "onnxruntime",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.setuptools.packages.find]
include = ["app*"]
